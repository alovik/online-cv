career-profile:
  title: Career Profile
  summary: |
    I am a researcher interested in statistical and epidemilogical methods, how these methods can be used to solve real-world problems and how to best communicate them. 
    My applied research is mainly focused on (public) mental health and amyotrophic lateral sclerosis.
    I currently work as an Assistant professor at the Methodology and Statistics Unit at Leiden University and I am also affiliated with the Unit of Integrative Epidemiology at Karolinska Institutet.
